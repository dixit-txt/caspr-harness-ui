[project]
name = "caspr-harness-ui"
version = "0.1.0"
description = "Browser harness for the Caspr agent — full-graph flow runs and single-node runs"
readme = "README.md"
authors = [
    { name = "dixit-svg", email = "dixit@ez.works" }
]
requires-python = ">=3.14.5"
# Intentionally empty: server.py re-execs under caspr-core's .venv, which already
# has fastapi / uvicorn / langgraph / langchain and the app itself.
dependencies = []

[project.scripts]
caspr-harness-ui = "caspr_harness_ui:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
